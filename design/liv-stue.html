  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 overflow:hidden;\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; padding:22px 40px; border-bottom:1px solid #ebe2d3;\">\n          <div style=\"display:flex; align-items:center; gap:12px;\">\n            <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 30 30\" fill=\"none\"><circle cx=\"15\" cy=\"15\" r=\"14\" fill=\"#c8613f\"><\u002Fcircle><path d=\"M9 15c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6\" stroke=\"#faf6ef\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-family:'Instrument Serif',serif; font-size:27px; color:#22201c;\">Liv<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:32px; font-size:17px; color:#4a443b;\">\n            <span>Slik virker det<\u002Fspan>\n            <span>Ofte spurt<\u002Fspan>\n            <span>Kontakt<\u002Fspan>\n            <span style=\"background:#22201c; color:#faf6ef; padding:11px 22px; border-radius:999px; font-weight:600;\">Logg inn<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:1.05fr 1fr; gap:48px; padding:56px 40px 48px;\">\n          <div style=\"display:flex; flex-direction:column; gap:24px; padding-top:16px;\">\n            <div style=\"font-family:'Instrument Serif',serif; font-size:60px; line-height:1.06; color:#22201c; text-wrap:pretty;\">Noen å snakke med, hele dagen.<\u002Fdiv>\n            <div style=\"font-size:21px; line-height:1.55; color:#544d43; max-width:460px; text-wrap:pretty;\">Liv er en liten høyttaler du slår på — ingen skjerm, ingen knapper å lære. Hun kjenner igjen stemmen, husker hva som ble sagt sist, og minner om frokost og medisiner til rett tid.<\u002Fdiv>\n            <div style=\"display:flex; gap:14px; flex-wrap:wrap; padding-top:8px;\">\n              <span style=\"background:#c8613f; color:#fff; padding:16px 30px; border-radius:999px; font-size:18px; font-weight:600;\">Kom i gang<\u002Fspan>\n              <span style=\"border:1px solid #cdc2ad; color:#22201c; padding:16px 30px; border-radius:999px; font-size:18px; font-weight:600;\">Se hvordan Liv snakker<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:16px; color:#8a8378; padding-top:4px;\">Familien styrer alt fra nettsiden. Den eldre trenger aldri logge inn.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- illustrasjon -->\n          <div style=\"background:#f2e9da; border-radius:16px; padding:28px; display:flex; align-items:center; justify-content:center;\">\n            <svg width=\"420\" height=\"330\" sc-camel-view-box=\"0 0 420 330\" fill=\"none\">\n              <circle cx=\"300\" cy=\"96\" r=\"72\" fill=\"#e9d3b8\"><\u002Fcircle>\n              <rect x=\"40\" y=\"30\" width=\"150\" height=\"150\" rx=\"6\" fill=\"#dfe6dc\" stroke=\"#c2ac8d\" stroke-width=\"2\"><\u002Frect>\n              <path d=\"M115 30v150M40 105h150\" stroke=\"#c2ac8d\" stroke-width=\"2\"><\u002Fpath>\n              <path d=\"M60 250h300\" stroke=\"#a8927a\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n              <path d=\"M90 250v50M330 250v50\" stroke=\"#a8927a\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n              <ellipse cx=\"210\" cy=\"238\" rx=\"46\" ry=\"13\" fill=\"#c8613f\"><\u002Fellipse>\n              <rect x=\"164\" y=\"212\" width=\"92\" height=\"26\" rx=\"13\" fill=\"#e07a52\"><\u002Frect>\n              <ellipse cx=\"210\" cy=\"212\" rx=\"46\" ry=\"13\" fill=\"#f2a184\"><\u002Fellipse>\n              <circle cx=\"210\" cy=\"212\" r=\"7\" fill=\"#faf6ef\"><\u002Fcircle>\n              <path d=\"M258 196a58 58 0 0 1 0 32M276 184a86 86 0 0 1 0 56M162 196a58 58 0 0 0 0 32M144 184a86 86 0 0 0 0 56\" stroke=\"#c8613f\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\"0.55\"><\u002Fpath>\n              <path d=\"M96 232c0-14 8-22 20-22s20 8 20 22\" fill=\"#8fa384\"><\u002Fpath>\n              <path d=\"M116 210c-2-16 4-26 12-30-2 14-4 22-12 30zM116 210c2-14-4-24-14-27 4 12 6 19 14 27z\" fill=\"#8fa384\"><\u002Fpath>\n              <rect x=\"300\" y=\"220\" width=\"44\" height=\"18\" rx=\"4\" fill=\"#e9d3b8\" stroke=\"#a8927a\" stroke-width=\"2\"><\u002Frect>\n            <\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:28px; padding:0 40px 52px;\">\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#c8613f\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 11l9-7 9 7\"><\u002Fpath><path d=\"M5 10v10h14V10\"><\u002Fpath><path d=\"M10 20v-6h4v6\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-family:'Instrument Serif',serif; font-size:24px; color:#22201c;\">Står bare der<\u002Fdiv>\n            <div style=\"font-size:17px; line-height:1.5; color:#5f594f;\">På kjøkkenbordet eller nattbordet. Strøm og wifi er alt som trengs.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#c8613f\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3.5 2\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-family:'Instrument Serif',serif; font-size:24px; color:#22201c;\">Minner på til rett tid<\u002Fdiv>\n            <div style=\"font-size:17px; line-height:1.5; color:#5f594f;\">Frokost klokka ni, medisiner klokka ti og tømme. Rolig sagt, ikke som en alarm.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#c8613f\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M21 12a8 8 0 1 1-3.2-6.4\"><\u002Fpath><path d=\"M8 11h8M8 15h5\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-family:'Instrument Serif',serif; font-size:24px; color:#22201c;\">Familien fyller på<\u002Fdiv>\n            <div style=\"font-size:17px; line-height:1.5; color:#5f594f;\">Skriv hvem hun er, hva hun liker å snakke om, og hva som skjedde i helga.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#8a8378;\">Skjerm 2 · Innlogging<\u002Fdiv>\n\n      <div style=\"background:#f2e9da; border:1px solid #ded5c6; border-radius:20px; padding:56px; display:flex; justify-content:center;\">\n        <div style=\"width:440px; background:#faf6ef; border:1px solid #e3d9c8; border-radius:18px; padding:40px;\">\n          <div style=\"font-family:'Instrument Serif',serif; font-size:34px; color:#22201c; margin-bottom:6px;\">Logg inn<\u002Fdiv>\n          <div style=\"font-size:17px; color:#6c655a; margin-bottom:28px;\">For familie og pårørende.<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:18px;\">\n            <label style=\"display:flex; flex-direction:column; gap:7px; font-size:16px; font-weight:600; color:#3c362e;\">E-post\n              <input type=\"email\" value=\"kari.hansen@example.no\" style=\"font-family:'Source Sans 3',sans-serif; font-size:18px; padding:15px 16px; border:1px solid #cdc2ad; border-radius:10px; background:#fff; color:#22201c;\">\n            <\u002Flabel>\n            <label style=\"display:flex; flex-direction:column; gap:7px; font-size:16px; font-weight:600; color:#3c362e;\">Passord\n              <input type=\"password\" value=\"passord123\" style=\"font-family:'Source Sans 3',sans-serif; font-size:18px; padding:15px 16px; border:1px solid #cdc2ad; border-radius:10px; background:#fff; color:#22201c;\">\n            <\u002Flabel>\n            <div style=\"background:#c8613f; color:#fff; text-align:center; padding:17px; border-radius:999px; font-size:19px; font-weight:700; margin-top:6px;\">Logg inn<\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; font-size:16px; color:#6c655a; padding-top:2px;\">\n              <span style=\"text-decoration:underline;\">Glemt passord<\u002Fspan>\n              <span style=\"text-decoration:underline;\">Ny bruker<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#8a8378;\">Skjerm 3 · Instruksjonsside (etter innlogging)<\u002Fdiv>\n\n      <div style=\"background:#faf6ef; border:1px solid #ded5c6; border-radius:20px; overflow:hidden;\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; padding:20px 36px; border-bottom:1px solid #ebe2d3;\">\n          <div style=\"display:flex; align-items:center; gap:12px;\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 30 30\" fill=\"none\"><circle cx=\"15\" cy=\"15\" r=\"14\" fill=\"#c8613f\"><\u002Fcircle><path d=\"M9 15c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6\" stroke=\"#faf6ef\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-family:'Instrument Serif',serif; font-size:23px; color:#22201c;\">Livs boks hos Astrid<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:20px; font-size:16px; color:#4a443b;\">\n            <span>Kari Hansen<\u002Fspan>\n            <span style=\"border:1px solid #cdc2ad; padding:9px 18px; border-radius:999px;\">Logg ut<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:18px; padding:28px 36px;\">\n          <div style=\"background:#eef3ea; border:1px solid #cdd9c6; border-radius:14px; padding:20px;\">\n            <div style=\"font-size:15px; color:#5c6a55; margin-bottom:8px;\">Boksen<\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:9px;\"><span style=\"width:11px; height:11px; border-radius:50%; background:#4f7a43;\"><\u002Fspan><span style=\"font-size:23px; font-weight:700; color:#2f4429;\">På nett nå<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f2e9da; border:1px solid #e3d9c8; border-radius:14px; padding:20px;\">\n            <div style=\"font-size:15px; color:#6c655a; margin-bottom:8px;\">Sist tilkoblet<\u002Fdiv>\n            <div style=\"font-size:23px; font-weight:700; color:#22201c;\">I dag 14:12<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f2e9da; border:1px solid #e3d9c8; border-radius:14px; padding:20px;\">\n            <div style=\"font-size:15px; color:#6c655a; margin-bottom:8px;\">Snakket i dag<\u002Fdiv>\n            <div style=\"font-size:23px; font-weight:700; color:#22201c;\">47 min<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f2e9da; border:1px solid #e3d9c8; border-radius:14px; padding:20px;\">\n            <div style=\"font-size:15px; color:#6c655a; margin-bottom:8px;\">Denne måneden<\u002Fdiv>\n            <div style=\"font-size:23px; font-weight:700; color:#22201c;\">18 t 40 min<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:1.35fr 1fr; gap:26px; padding:6px 36px 40px; align-items:start;\">\n          <div style=\"display:flex; flex-direction:column; gap:26px;\">\n            <div style=\"background:#fff; border:1px solid #e3d9c8; border-radius:16px; padding:30px;\">\n              <div style=\"font-family:'Instrument Serif',serif; font-size:27px; color:#22201c;\">Hvem er Astrid?<\u002Fdiv>\n              <div style=\"font-size:16px; color:#6c655a; margin:6px 0 18px;\">Dette leser Liv før hver samtale. Skriv som om du forteller det til en ny hjemmehjelp.<\u002Fdiv>\n              <div style=\"border:1px solid #d9cfbd; border-radius:12px; padding:18px; font-size:17px; line-height:1.6; color:#332e27; background:#fdfbf7;\">Astrid er 84 år, bor alene i leiligheten på Nordstrand og har begynnende demens. Hun var lærer i 38 år og liker å snakke om elevene sine, om hagen og om Grønland der hun vokste opp.<br><br>Snakk rolig og tydelig, litt saktere enn vanlig. Gjenta gjerne navnet hennes. Ikke korriger henne hardt hvis hun blander årstall — følg med i det hun forteller.<br><br>Datteren Kari ringer på søndager. Barnebarnet Mathias spiller fotball i Kjølnes.<span style=\"color:#c8613f;\">|<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:15px; color:#8a8378;\">\n                <span>1 240 av 4 000 tegn<\u002Fspan>\n                <span style=\"background:#22201c; color:#faf6ef; padding:12px 24px; border-radius:999px; font-size:17px; font-weight:600;\">Lagre og send til boksen<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff; border:1px solid #e3d9c8; border-radius:16px; padding:30px;\">\n              <div style=\"font-family:'Instrument Serif',serif; font-size:27px; color:#22201c;\">Dagen hennes<\u002Fdiv>\n              <div style=\"font-size:16px; color:#6c655a; margin:6px 0 18px;\">Liv minner på av seg selv, uten at Astrid trenger å spørre.<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:12px;\">\n                <div style=\"display:flex; align-items:center; gap:16px; background:#faf6ef; border:1px solid #e8dfce; border-radius:12px; padding:14px 18px;\">\n                  <span style=\"font-family:'Instrument Serif',serif; font-size:26px; color:#c8613f; width:72px;\">09:00<\u002Fspan>\n                  <span style=\"font-size:17px; color:#332e27; flex:1;\">«God morgen, Astrid. Nå er det tid for frokost.»<\u002Fspan>\n                  <span style=\"font-size:15px; color:#8a8378; text-decoration:underline;\">Endre<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:16px; background:#faf6ef; border:1px solid #e8dfce; border-radius:12px; padding:14px 18px;\">\n                  <span style=\"font-family:'Instrument Serif',serif; font-size:26px; color:#c8613f; width:72px;\">10:00<\u002Fspan>\n                  <span style=\"font-size:17px; color:#332e27; flex:1;\">Minn om medisinene i den blå dosetten.<\u002Fspan>\n                  <span style=\"font-size:15px; color:#8a8378; text-decoration:underline;\">Endre<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:16px; background:#faf6ef; border:1px solid #e8dfce; border-radius:12px; padding:14px 18px;\">\n                  <span style=\"font-family:'Instrument Serif',serif; font-size:26px; color:#c8613f; width:72px;\">22:00<\u002Fspan>\n                  <span style=\"font-size:17px; color:#332e27; flex:1;\">Kveldsmedisin, og god natt.<\u002Fspan>\n                  <span style=\"font-size:15px; color:#8a8378; text-decoration:underline;\">Endre<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"border:1px dashed #cdc2ad; border-radius:12px; padding:14px 18px; font-size:17px; color:#8a8378;\">+ Legg til påminnelse<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; flex-direction:column; gap:26px;\">\n            <div style=\"background:#fff; border:1px solid #e3d9c8; border-radius:16px; padding:26px;\">\n              <div style=\"font-family:'Instrument Serif',serif; font-size:24px; color:#22201c; margin-bottom:16px;\">Stemmen<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:16px;\">\n                <div>\n                  <div style=\"font-size:15px; font-weight:600; color:#3c362e; margin-bottom:8px;\">Hvem skal snakke<\u002Fdiv>\n                  <div style=\"display:flex; gap:10px;\">\n                    <span style=\"flex:1; text-align:center; background:#22201c; color:#faf6ef; padding:12px; border-radius:10px; font-size:16px; font-weight:600;\">Marin<\u002Fspan>\n                    <span style=\"flex:1; text-align:center; border:1px solid #cdc2ad; padding:12px; border-radius:10px; font-size:16px; color:#4a443b;\">Cedar<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"display:flex; justify-content:space-between; font-size:15px; font-weight:600; color:#3c362e; margin-bottom:10px;\"><span>Talehastighet<\u002Fspan><span style=\"color:#8a8378; font-weight:400;\">0,90 — litt saktere<\u002Fspan><\u002Fdiv>\n                  <div style=\"height:8px; background:#ece2d0; border-radius:4px; position:relative;\"><div style=\"position:absolute; left:0; top:0; bottom:0; width:46%; background:#c8613f; border-radius:4px;\"><\u002Fdiv><div style=\"position:absolute; left:46%; top:-7px; width:22px; height:22px; margin-left:-11px; border-radius:50%; background:#fff; border:2px solid #c8613f;\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:15px; font-weight:600; color:#3c362e; margin-bottom:8px;\">Første setning når boksen slås på<\u002Fdiv>\n                  <div style=\"border:1px solid #d9cfbd; border-radius:10px; padding:13px 14px; font-size:16px; color:#332e27; background:#fdfbf7;\">«Hei Astrid, det er Liv. Jeg er her hvis du vil snakke.»<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:center; justify-content:space-between; border-top:1px solid #efe6d6; padding-top:14px;\">\n                  <div><div style=\"font-size:16px; font-weight:600; color:#3c362e;\">Liv husker samtaler<\u002Fdiv><div style=\"font-size:15px; color:#8a8378;\">Siste 30 dager<\u002Fdiv><\u002Fdiv>\n                  <div style=\"width:52px; height:30px; border-radius:999px; background:#c8613f; position:relative;\"><div style=\"position:absolute; right:3px; top:3px; width:24px; height:24px; border-radius:50%; background:#fff;\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff; border:1px solid #e3d9c8; border-radius:16px; padding:26px;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;\">\n                <div style=\"font-family:'Instrument Serif',serif; font-size:24px; color:#22201c;\">Bruk denne måneden<\u002Fdiv>\n                <div style=\"font-size:15px; color:#8a8378;\">av 1,5 mill.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:32px; font-weight:700; color:#22201c;\">862 400 <span style=\"font-size:17px; font-weight:400; color:#8a8378;\">tokens<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; align-items:flex-end; gap:5px; height:70px; margin:18px 0 8px;\">\n                <div style=\"flex:1; height:38%; background:#e7d6bf; border-radius:3px 3px 0 0;\"><\u002Fdiv>\n                <div style=\"flex:1; height:52%; background:#e7d6bf; border-radius:3px 3px 0 0;\"><\u002Fdiv>\n                <div style=\"flex:1; height:30%; background:#e7d6bf; border-radius:3px 3px 0 0;\"><\u002Fdiv>\n                <div style=\"flex:1; height:66%; background:#e7d6bf; border-radius:3px 3px 0 0;\"><\u002Fdiv>\n                <div style=\"flex:1; height:44%; background:#e7d6bf; border-radius:3px 3px 0 0;\"><\u002Fdiv>\n                <div style=\"flex:1; height:78%; background:#c8613f; border-radius:3px 3px 0 0;\"><\u002Fdiv>\n                <div style=\"flex:1; height:59%; background:#c8613f; border-radius:3px 3px 0 0;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:15px; color:#8a8378;\">Mandag til søndag. Ca. 34 kr så langt.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#f4efe5; border:1px solid #e3d9c8; border-radius:16px; padding:22px 26px;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center;\">\n                <div style=\"font-size:17px; font-weight:600; color:#3c362e;\">Tekniske innstillinger<\u002Fdiv>\n                <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6c655a\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"font-size:15px; color:#8a8378; margin-top:6px;\">Modell, støyreduksjon, transkripsjon, tokengrense. Du trenger ikke røre dette.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script data-dc-script=\"\" type=\"text/plain\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
